name: Publish

# Manual only. Publishing is not something a merge should do by itself.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options: [latest, next]

permissions:
  contents: read
  # Required for npm provenance, which ties the published tarball to this run.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The same gates CI runs. Publishing an unverified build would defeat
      # the point of having them.
      - run: npm run format:check
      - run: npm run lint:strict
      - run: npm run lint:types
      - run: npm run typecheck:ci
      - run: npm run typecheck:tools:ci
      - run: npm run typecheck:test:ci
      - run: npm test
      - run: npm run verify:schema
      - run: npm run verify:norefs
      - run: npm run verify:pack
      - run: npm run verify:publish

      - name: Refuse to republish a version that already exists
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm. Bump the version first." >&2
            exit 1
          fi

      - run: npm publish --provenance --access public --tag ${{ inputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
